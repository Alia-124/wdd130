<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact rapids Adventure Rafting for question, reservation, and infomation about our whitewater rafting adventures.">
    <meta name="author" content="Nancy salaiau">

    <title>Contact us - Rafting Adventure </title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="White Water Rafting logo" width="200">

        <nav>

            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>

        </nav>
    </header>
    <main class="contact">
        <h1>Contact Us</h1>

        <section class="contact-info">
            <div class="contact-details">
                <h2>Get in Touch</h2>


                <p><strong>Address:</strong>123 River Road, Sigatoka,Fiji</p>
                <P><strong>Phone:</strong>+679 000 000</P>
                <p><strong>Email:</strong>infor@rapidsadventure.com</p>
            </div>

            <div class="contact-map">
                <iframe
                  src="your_google_map_emed_link-https://www.google.com/maps/place/Rivers+Fiji/data=!4m7!3m6!1s0x6e1a31ec929805cd:0xa1c6b6775d6ffbdf!8m2!3d-18.2433774!4d178.0820186!16s%2Fg%2F11gh2snwmy!19sChIJzQWYkuwxGm4R3_tvXXe2xqE?authuser=0&hl=en&g_ep=EgoyMDI2MDkzMC4wIJJjKgBIAVA"
                  tittle="Map showing the location of Rapids Adventure Rafting" loading="lazy">
                </iframe>
            </div>
            </sectio>

            <section class="employees">
                <h2>Meet our Team</h2>
                <div class="employee-profiles">

                    <figure>
                        <img src="images/safty-coordinator.jpg" alt="Rapid Adventure rafting guide">
                        <figcaption>Jane smith -safty coordinator</figcaption>
                    </figure>

                    <figure>
                        <img src="images/trip-coordinator.jpg" alt="Rapids trip coordinator">
                        <figcaption>Michael Smith - Trip coordinator</figcaption>
                    </figure>
                </div>

            </section>

            <section>
                <h2>send Us a Message</h2>
                <form class="Contact-form">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="required">

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <filedset>
                        <legend>Purpose of Message</legend>

                        <label class="radio-option">
                            <input type="radio" name="purpose" value="general">
                            General Inquiry
                        </label>

                        <label class="radio-option">
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                    </filedset>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>

                    <label class="newsletter">
                        <input type="checkbox" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Send Message</button>
                </form>
            </section>
    </main>
    <footer>
        <p>&copy; 2026 Rapids Adventure Rafting |Nancy Salaiau</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon" width="200">
            </a>

            <a href="https://instagram.com">
                <img src="images/linkedin.png" alt="linkedin Icon" width="200">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon" width="200">
            </a>
        </nav>
    </footer>
</body>

</html>
