<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact rapids Adventure Rafting for question, reservation, and infomation about our whitewater rafting adventures.">
    <meta name="author" content="Nancy salaiau">

    <title>Contact us - Rafting Adventure </title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="White Water Rafting logo" width="200">

        <nav>

            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>

        </nav>
    </header>
    <main class="contact">
        <h1>Contact Us</h1>

        <section class="contact-info">
            <div class="contact-details">
                <h2>Get in Touch</h2>


                <p><strong>Address:</strong>123 River Road, Sigatoka,Fiji</p>
                <P><strong>Phone:</strong>+679 000 000</P>
                <p><strong>Email:</strong>infor@rapidsadventure.com</p>
            </div>

            <div class="contact-map">
                <iframe
                  src="https://fijipocketguide.com/wp-content/uploads/2024/09/Navua-River-Rafting-Rivers-Fiji-3.jpg"
                  title=" Map showing the location of Rapids Adventure Rafting " loading=" lazy">
                </iframe>
            </div>
        </section>

        <section class=" employees">
            <h2>Meet our Team</h2>
            <div class="employee-profiles">

                <figure>
                    <img src="images/safty-coordinator.jpg" alt="Rapid Adventure rafting guide">
                    <figcaption>Jane smith -safty coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/trip-coordinator.jpg" alt="Rapids trip coordinator">
                    <figcaption>Michael Smith - Trip coordinator</figcaption>
                </figure>
            </div>

        </section>

        <section>
            <h2>Send Us a Message</h2>
            <from class="contact-form"></from>
            <fieldset>
                <legend> Purpose of Message</legend>
                <label for="name">Name:</label>
                <input type="text" id="name" name="required">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <form>
                    <legend>Purpose of Message</legend>

                    <label class="radio-option">
                        <input type="radio" name="purpose" value="general">
                        General Inquiry
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                </form>

                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>

                <label class="newsletter">
                    <input type="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </fieldset>
        </section>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Rapids Adventure Rafting |Nancy Salaiau</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon" width="200">
            </a>

            <a href="https://instagram.com">
                <img src="images/linkedin.png" alt="linkedin Icon" width="200">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon" width="200">
            </a>
        </nav>
    </footer>
</body>

</html>
